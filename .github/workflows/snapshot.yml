name: Refresh flavor snapshot

on:
  schedule:
    # 13:00 UTC / 6am Pacific, after Yogurtland's overnight flavor updates land.
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ingestion
        run: pnpm ingest

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/stores.json public/data/flavors.json public/data/meta.json
          if git diff --cached --quiet; then
            echo "No flavor changes today, nothing to commit."
          else
            git commit -m "chore: refresh flavor snapshot"
            git push
          fi
